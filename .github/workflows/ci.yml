name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install yamllint

      - name: Generate Ansible inventory from CSV
        run: |
          python3 scripts/inventory_to_ansible.py

      - name: Validate generated Ansible inventory YAML
        run: |
          python3 - <<'PY'
import sys, yaml
path = 'ansible/generated_inventory.yml'
try:
    with open(path, 'r', encoding='utf-8') as f:
        yaml.safe_load(f)
except Exception as e:
    print('Inventory YAML validation failed:', e)
    sys.exit(2)
print('Inventory YAML OK')
PY

      - name: Lint YAML
        run: yamllint . || true

      - name: Lint JSON
        run: |
          set -e
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python -m json.tool || true

      - name: Build PDF
        run: python3 scripts/build_pdf.py --out ./diagrams/d2lab-network-overview.pdf

      - name: Upload diagram artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2lab-diagram
          path: diagrams/d2lab-network-overview.pdf
